<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Producto - LUZ Y AROMA</title>
<link rel="stylesheet" href="../css/styles.css">

<style>
.detalle {
  max-width: 900px;
  margin: 40px auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
}

.detalle img {
  width: 100%;
  border-radius: 10px;
}

.info {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

button {
  padding: 12px;
  background: #777e54;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <div class="logo-container">
    <img src="../assets/logo.jpg" alt="Logo">
  </div>

  <nav>
    <ul>
      <li><a href="../index.html">Inicio</a></li>

      <!-- 🔥 MENU DINAMICO -->
      <li class="submenu">
        <a href="#">Productos ▾</a>
        <ul class="submenu-content" id="menu-categorias"></ul>
      </li>

      <li><a href="carrito.html" id="link-carrito">Carrito (0)</a></li>
      <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
    </ul>
  </nav>
</header>

<div id="detalle-producto" class="detalle"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "luzyaroma3d.firebaseapp.com",
  projectId: "luzyaroma3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// =========================
// 🔥 CATEGORIAS HEADER
// =========================
async function cargarCategorias() {
  const cont = document.getElementById("menu-categorias");
  cont.innerHTML = "";

  const snap = await getDocs(collection(db, "Categorias"));

  snap.forEach(doc => {
    const c = doc.data();

    const li = document.createElement("li");
    li.innerHTML = `
      <a href="productos.html?cat=${c.slug}">
        ${c.nombre}
      </a>
    `;

    cont.appendChild(li);
  });
}

// =========================
// 📦 PRODUCTO
// =========================
async function cargarProducto() {
  if (!id) return;

  const ref = doc(db, "Productos", id);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    document.getElementById("detalle-producto").innerHTML = "<p>Producto no encontrado</p>";
    return;
  }

  const p = snap.data();

  const cont = document.getElementById("detalle-producto");

  cont.innerHTML = `
    <img src="${p.imagen}">

    <div class="info">
      <h2>${p.nombre}</h2>
      <p>$${p.precio}</p>
      <p>${p.descripcion || "Sin descripción aún"}</p>

      <button id="btn-agregar">
        Agregar al carrito
      </button>

      <a href="productos.html">⬅ Volver</a>
    </div>
  `;

  // 🔥 FIX BOTON
  document.getElementById("btn-agregar").onclick = () => {
    agregarAlCarrito(p);
  };
}

// =========================
// 🛒 CARRITO
// =========================
function agregarAlCarrito(p) {
  let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

  const exist = carrito.find(x => x.nombre === p.nombre);

  if (exist) exist.cantidad++;
  else carrito.push({
    nombre: p.nombre,
    precio: p.precio,
    cantidad: 1,
    imagen: p.imagen
  });

  localStorage.setItem("carrito", JSON.stringify(carrito));

  actualizarCarrito();

  alert("Agregado 🛒");
}

function actualizarCarrito() {
  const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
  const total = carrito.reduce((a, p) => a + p.cantidad, 0);

  const link = document.getElementById("link-carrito");
  if (link) link.textContent = `Carrito (${total})`;
}

// =========================
// INIT
// =========================
cargarCategorias();
cargarProducto();
actualizarCarrito();

</script>

<!-- 🔥 TU SCRIPT MENU (NO LO TOCO) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const submenu = document.querySelector(".submenu");

  submenu.addEventListener("click", (e) => {
    if (e.target.tagName === "A" && e.target.nextElementSibling) {
      e.preventDefault();
      submenu.classList.toggle("open");
    }
  });

  document.addEventListener("click", (e) => {
    if (!submenu.contains(e.target)) {
      submenu.classList.remove("open");
    }
  });
});
</script>

</body>
</html>
