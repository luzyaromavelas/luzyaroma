<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - LUZ Y AROMA</title>
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        h2.titulo-carrito {
            text-align: center;
            color: #777e54;
            margin: 40px 0 20px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #f5f5f5;
        }

        th, td {
            border-bottom: 1px solid #eee;
            padding: 12px;
            text-align: center;
        }

        #total-carrito {
            text-align: center;
            font-size: 22px;
            margin-top: 25px;
            font-weight: bold;
        }

        .botones-carrito {
            text-align: center;
            margin-top: 20px;
        }

        .botones-carrito button {
            padding: 12px 20px;
            margin: 8px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        .whatsapp {
            background-color: #25D366;
            color: white;
        }

        .vaciar {
            background-color: #eee;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777e54;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
  <div class="logo-container">
    <img src="../assets/logo.jpg" alt="Logo">
  </div>

  <nav>
    <ul>
      <li><a href="../index.html">Inicio</a></li>

      <!-- 🔥 MENU DINAMICO -->
      <li class="submenu">
        <a href="productos.html">Productos</a>
        <ul class="submenu-content" id="menu-categorias"></ul>
      </li>

      <li>
        <a href="carrito.html" id="link-carrito">Carrito (0)</a>
      </li>

      <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
    </ul>
  </nav>
</header>

<h2 class="titulo-carrito">🛒 Tu Carrito</h2>

<table id="tabla-carrito">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Notas</th>
            <th>Eliminar</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<p id="total-carrito">Total: $0</p>

<div class="botones-carrito">
    <button class="whatsapp" onclick="generarEnlaceWhatsApp()">
  📲 WhatsApp
</button>
    <button id="vaciar-carrito" class="vaciar">🗑 Vaciar</button>
</div>

<a class="volver" href="productos.html">⬅️ Seguir comprando</a>

<script src="../js/carrito.js"></script>

<!-- 🔥 CATEGORIAS DINAMICAS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "luzyaroma3d.firebaseapp.com",
  projectId: "luzyaroma3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function cargarCategorias() {
  const contenedor = document.getElementById("menu-categorias");
  contenedor.innerHTML = "";

  const snap = await getDocs(collection(db, "Categorias"));

  snap.forEach(doc => {
    const c = doc.data();

    const li = document.createElement("li");
    li.innerHTML = `
      <a href="productos.html?cat=${c.slug}">
        ${c.nombre}
      </a>
    `;

    contenedor.appendChild(li);
  });
}

cargarCategorias();
</script>

</body>
</html>
